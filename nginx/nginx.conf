upstream frontend {
    server frontend:3000;
}
upstream backend {
    server backend:8000;
}
upstream ai_layer {
    server ai-layer:8001;
}

server {
    listen 80;
    server_name _;  # заменишь на свой IP или домен

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI Layer (если нужен прямой доступ)
    location /ai/ {
        proxy_pass http://ai_layer/;
        proxy_set_header Host $host;
    }
}