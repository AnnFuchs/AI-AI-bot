upstream frontend {
    server frontend:3000;
}
upstream backend {
    server backend:8000;
}
upstream ai_layer {
    server ai-layer:8001;
}

# Редирект HTTP -> HTTPS
server {
    listen 80;
    server_name ai-ai.sytes.net;
    return 301 https://$host$request_uri;
    server_name localhost;
    
    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI Layer
    location /ai/ {
        proxy_pass http://ai_layer/;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    server_name ai-ai.sytes.net;

    ssl_certificate /etc/letsencrypt/live/ai-ai.sytes.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-ai.sytes.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Backend API
    location /api/v1/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # AI Layer
    location /ai/ {
        proxy_pass http://ai_layer/;
        proxy_set_header Host $host;
    }
}