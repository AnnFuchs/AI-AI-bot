version: "3.9"

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: aiai_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: aiai_db
    env_file:
      - backend/infra/.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: aiai_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: aiai_redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-layer:
    build:
      context: ./ai_layer
      dockerfile: Dockerfile
    container_name: aiai_ai_layer
    env_file:
      - ai_layer/.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
      BACKEND_BASE_URL: http://backend:8000
      APP_ENV: production
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiai_backend
    env_file:
      - backend/infra/.env
    environment:
      APP_ENV: production
      POSTGRES_SERVER: db
      AI_LAYER_URL: http://ai-layer:8001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://<YOUR_VM_IP>
        NEXT_PUBLIC_API_INCLUDE_CREDENTIALS: "true"
    container_name: aiai_frontend
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data:
  redis_data: